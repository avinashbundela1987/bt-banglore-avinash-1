<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>India Weather</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 16px; }
    h1 { font-size: 1.5rem; }
    input { padding: 8px; width: 60%; font-size: 1rem; }
    button { padding: 8px 14px; font-size: 1rem; cursor: pointer; }
    #result { margin-top: 20px; min-height: 120px; }
    #result p { margin: 6px 0; }
    footer { margin-top: 30px; font-size: 0.8rem; color: #666; }
  </style>
</head>
<body>
  <h1>India Weather</h1>
  <input id="city" type="text" placeholder="Enter a city in India">
  <button id="go">Get Weather</button>
  <div id="result"></div>
  <footer>Weather data: Open-Meteo. Location data: OpenStreetMap Nominatim.</footer>
  <script src="app.js"></script>
</body>
</html>
