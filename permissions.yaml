rules:
  - capability: shell
    match:
      - "aws *"
      - "git *"
      - "npm *"
      - "npx *"
      - "node *"
      - "cmd *"
      - "powershell *"
      - "cd *"
      - "dir *"
      - "mkdir *"
      - "type *"
      - "echo *"
      - "copy *"
      - "move *"
      - "del *"
      - "pwd *"
      - "cat *"
      - "ls *"
      - "Get-Content *"
      - "Get-ChildItem *"
      - "Set-Content *"
      - "New-Item *"
      - "Remove-Item *"
      - "Copy-Item *"
      - "Move-Item *"
      - "Test-Path *"
      - "Start-Process *"
      - "Write-Host *"
      - "Invoke-WebRequest *"
      - "where.exe *"
    effect: allow
